name: engineering-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m engineering.cli demo
      - run: docker build -t engineering-demo . && docker run --rm --network none engineering-demo
      - run: docker pull python:3.12-slim && python -m engineering.sandbox_demo
